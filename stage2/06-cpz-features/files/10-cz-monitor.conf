[Service]
# The monitor is an external display, not the 53-column handheld panel, so it
# must not print cz-issue's panel box. Without --issue-file agetty falls back to
# /etc/issue, which is the panel banner; and --noclear appends it on every getty
# start, stacking boxes down the screen. Point at a plain monitor banner and
# clear the screen instead.
#
# ExecStart= must come first: getty@.service is Type=idle, which permits only one
# ExecStart, so appending without resetting would make the unit fail to load.
ExecStart=
ExecStart=-/sbin/agetty -o '-- \\u' --noreset --issue-file /etc/issue.cz-monitor - ${TERM}
