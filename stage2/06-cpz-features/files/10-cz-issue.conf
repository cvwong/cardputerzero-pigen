[Service]
# Regenerate /etc/issue immediately before agetty prints it, so the box border
# stays aligned around the current hostname and DHCP address. The leading '-'
# means a failure here must never stop the login prompt from appearing.
ExecStartPre=-/usr/local/sbin/cz-issue
ExecStart=
ExecStart=-/sbin/agetty -o '-- \\u' --noreset --issue-file /etc/issue - ${TERM}
