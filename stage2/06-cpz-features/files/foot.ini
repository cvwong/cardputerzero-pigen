# foot config for the CardputerZero monitor terminal (1920x1080 forced).
font=DejaVu Sans Mono:size=16
term=xterm-256color

[key-bindings]
# Hand the console back to the panel; cz-cage-watcher then stops the compositor.
#
# foot's syntax is action=[argv] key, not key=command, and it has no generic
# "spawn" action - the shipped "Alt+P=spawn cz-output panel" made foot exit 230
# with "not a valid action: Alt+P". pipe-visible is the only action that runs an
# arbitrary command; cz-output ignores the terminal text piped to its stdin.
# Both Alt+p and Alt+P are bound because the keypad reports the lowercase keysym
# and Alt+Shift+p is a distinct combination in foot's parser.
pipe-visible=[cz-output panel] Alt+p Alt+P
